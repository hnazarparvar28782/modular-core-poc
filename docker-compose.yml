version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: modular-core-poc-db
    environment:
      POSTGRES_USER: pocadmin
      POSTGRES_PASSWORD: pocsecret
      POSTGRES_DB: modularpoc
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocadmin -d modularpoc"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
